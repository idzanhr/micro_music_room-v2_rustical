[package]
name = "micro-music-room"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "A small, local-only music player for Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/idzanhr/micro_music_room-v2_rustical"
build = "build.rs"

[lib]
name = "micro_music_room"
path = "src/lib.rs"

[[bin]]
name = "MicroMusicRoom"
path = "src/main.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "mp4", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.19", features = ["raw-window-handle-06"] }
walkdir = "2"

[dev-dependencies]
i-slint-backend-testing = "1.19"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Media",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"
