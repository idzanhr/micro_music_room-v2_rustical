[package]
name = "micro-music-room"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "A small, local-only music player for Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/idzanhr/micro_music_room-v2_rustical"
build = "build.rs"

[lib]
name = "micro_music_room"
path = "src/lib.rs"

[[bin]]
name = "MicroMusicRoom"
path = "src/main.rs"

[dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "mp4", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.19"
walkdir = "2"

[build-dependencies]
slint-build = "1.19"

[profile.release]
lto = true
codegen-units = 1
strip = true
