name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Release build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release
      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/MicroMusicRoom | Out-Null
          Copy-Item target/release/MicroMusicRoom.exe, LICENSE, README.md dist/MicroMusicRoom/
          Compress-Archive -Path dist/MicroMusicRoom -DestinationPath MicroMusicRoom-v2-windows-x64.zip
      - name: Upload zip (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MicroMusicRoom-v2-windows-x64
          path: MicroMusicRoom-v2-windows-x64.zip
          retention-days: 30

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - run: cargo check --all-targets
