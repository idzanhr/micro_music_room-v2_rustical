name: Release

# Publishes the portable zip as a GitHub Release. Either push a tag such as v2.0, or change the
# version in RELEASE_VERSION on main (the release and its tag are then created by this workflow).
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [RELEASE_VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" }
          else { $v = (Get-Content RELEASE_VERSION | Where-Object { $_ -match '^v' } | Select-Object -First 1).Trim() }
          "VERSION=$v" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Package portable zip
        shell: pwsh
        run: |
          $name = "MicroMusicRoom-$env:VERSION-Portable-win-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/MicroMusicRoom.exe, LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ZIP=$name.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Portable build of Micro Music Room v2 (Rust). Unzip anywhere and run MicroMusicRoom.exe. No installer, no admin rights.

          Windows may show a SmartScreen warning because the exe is not code-signed yet: choose More info, then Run anyway.
          Your v1 library (%LOCALAPPDATA%\MusicRoom\library.json) is picked up automatically.

          SHA-256 of the zip: $((Get-Content "$env:ZIP.sha256").Split(' ')[0])
          "@
          # Re-running for the same version replaces the old release (and its tag).
          gh release delete "$env:VERSION" --cleanup-tag --yes 2>$null
          gh release create "$env:VERSION" "$env:ZIP" "$env:ZIP.sha256" --target ${{ github.sha }} --title "Micro Music Room $env:VERSION Portable" --notes $notes
